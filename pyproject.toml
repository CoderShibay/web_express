[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "web-express"
version = "0.1.0"
description = "Free, local web search for AI agents: results, page content and verbatim highlights in one call."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.2",
    "trafilatura>=2.0",
    "pypdf>=5.0",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
web-express = "web_express.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/web_express"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
